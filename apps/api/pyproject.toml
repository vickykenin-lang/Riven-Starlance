[project]
name = "riven-starlance-api"
version = "0.1.0"
description = "Riven-Starlance multi-agent research API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "boto3>=1.35,<2",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.12,<1",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
