name: ci

on:
  push:
    branches: [main, phase-1-foundation, phase-2-aws-deployment]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build
      - name: Start dashboard for visual capture
        run: |
          npm run start > /tmp/riven-dashboard.log 2>&1 &
          echo $! > /tmp/riven-dashboard.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/riven >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/riven-dashboard.log
          exit 1
      - uses: browser-actions/setup-chrome@v1
      - name: Capture Riven desktop and mobile screenshots
        run: |
          mkdir -p visual-artifacts
          chrome --headless=new --no-sandbox --hide-scrollbars --disable-gpu-sandbox --virtual-time-budget=12000 --window-size=1440,900 --screenshot=visual-artifacts/riven-desktop.png http://127.0.0.1:3000/riven
          chrome --headless=new --no-sandbox --hide-scrollbars --disable-gpu-sandbox --virtual-time-budget=12000 --window-size=412,915 --screenshot=visual-artifacts/riven-mobile.png http://127.0.0.1:3000/riven
      - name: Upload Riven visual artifacts
        uses: actions/upload-artifact@v4
        with:
          name: riven-visual-check
          path: apps/dashboard/visual-artifacts/*.png
          if-no-files-found: error
          retention-days: 7

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t riven-api:ci apps/api
      - run: docker build -t riven-dashboard:ci apps/dashboard
      - run: cp infra/.env.example infra/.env
      - run: docker compose -f infra/docker-compose.prod.yml config
