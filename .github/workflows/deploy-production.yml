name: deploy-production

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: riven-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: [self-hosted, linux, x64, riven-starlance]
    timeout-minutes: 35
    steps:
      - name: Deploy verified main to production EC2
        run: bash /home/ubuntu/Riven-Starlance/infra/deploy-production.sh
